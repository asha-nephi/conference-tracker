<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conference Check-In</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <h1>Welcome!</h1>
  <p class="subtitle">Tap below to check yourself in for today's session.</p>

  <button class="btn-primary big-cta" id="notMemberBtn">I'm not a member</button>

  <div class="or-divider">or, if you're a member</div>

  <div class="card member-card" id="memberCard">
    <div class="toggle-group">
      <button class="toggle-btn active" id="memberIndividualBtn" type="button">Individual</button>
      <button class="toggle-btn" id="memberFamilyBtn" type="button">Family / with kids</button>
    </div>

    <div id="wardIndividualSection">
      <div class="ward-grid-compact" id="wardGridIndividual"></div>
    </div>

    <div id="wardFamilySection" style="display:none">
      <div class="ward-grid-compact" id="wardGridFamily"></div>
    </div>

    <div id="familyDetailsSection" style="display:none">
      <p class="subtitle" style="margin:8px 0" id="familyWardLabel"></p>
      <label for="famName">Your name</label>
      <input type="text" id="famName" placeholder="e.g. Brother Okafor">

      <label for="famPhone">Phone</label>
      <input type="text" id="famPhone" placeholder="Optional if address given">
      <label for="famAddress">Address</label>
      <input type="text" id="famAddress" placeholder="Optional if phone given">

      <label>How many of you are here? (including you)</label>
      <div class="counter-row">
        <button class="counter-btn" id="partyMinus" type="button">-</button>
        <input type="number" id="partySize" value="1" min="1">
        <button class="counter-btn" id="partyPlus" type="button">+</button>
      </div>

      <button class="btn-primary" id="familySubmitBtn">Check In</button>
    </div>

    <div id="memberDoneMsg" class="inline-done" style="display:none">✓ Checked in. Thank you!</div>
  </div>

  <div class="card" id="guestCard" style="display:none">
    <p class="subtitle" style="margin:0 0 8px">So glad you're here! It's totally fine if you came on your own.</p>
    <label for="guestName">Your name</label>
    <input type="text" id="guestName" placeholder="e.g. John Smith">

    <label for="guestPhone">Phone</label>
    <input type="text" id="guestPhone" placeholder="Optional if address given">
    <label for="guestAddress">Address</label>
    <input type="text" id="guestAddress" placeholder="Optional if phone given">

    <label for="guestInvitedBy">Who invited you? (optional)</label>
    <input type="text" id="guestInvitedBy" placeholder="Leave blank if no one did">

    <button class="btn-primary" id="guestSubmitBtn">Check In</button>
    <button class="btn-secondary" id="backToWelcome">Back</button>
  </div>

  <div class="card" id="doneCard" style="display:none">
    <div class="total-big">✓</div>
    <div class="total-label">You're checked in. Thank you!</div>
  </div>
</div>

<script src="./supabase-config.js"></script>
<script>
const WARDS = ['Dopemu Ward', 'Ifako Ward', 'Ikeja Ward', 'Maryland Ward', 'Opebi Ward', 'Oshodi Ward', 'Shogunle Ward'];
const zone = new URLSearchParams(location.search).get('zone') || 'front';
const session = new URLSearchParams(location.search).get('session') || null;
let selectedFamilyWard = null;

function todaySession() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function renderWardGrid(el, onPick) {
  el.innerHTML = '';
  WARDS.forEach((w) => {
    const btn = document.createElement('button');
    btn.className = 'ward-btn-compact';
    btn.type = 'button';
    btn.textContent = w;
    btn.addEventListener('click', () => onPick(w));
    el.appendChild(btn);
  });
}
renderWardGrid(document.getElementById('wardGridIndividual'), (ward) => submitMemberIndividual(ward));
renderWardGrid(document.getElementById('wardGridFamily'), (ward) => {
  selectedFamilyWard = ward;
  document.getElementById('familyWardLabel').textContent = `${ward} — enter your details below`;
  document.getElementById('familyDetailsSection').style.display = '';
});

// crypto.randomUUID() only exists in "secure contexts" (HTTPS, or localhost) —
// the local self-serve flow is reached over plain http://<lan-ip>, which
// doesn't qualify, so it's undefined there. Fall back to a plain JS UUID v4
// in that case (fine for de-duplication purposes, doesn't need to be
// cryptographically random).
function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

// Try this laptop's local server first (works with zero internet, and keeps
// a local backup copy). If that's unreachable — e.g. this page was opened
// from the public GitHub Pages link over cellular data — fall back to
// writing straight to the shared cloud database.
async function submitCheckin(fields) {
  const record = Object.assign({
    id: genId(),
    zone,
    session: session || todaySession(),
    method: 'qr_self',
    party_size: 1,
    total_count: 1,
    created_at: new Date().toISOString()
  }, fields);
  if (record.entry_type === 'family') record.total_count = Math.max(1, parseInt(record.party_size, 10) || 1);

  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2500);
    const res = await fetch('/api/checkin', {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(record)
    });
    clearTimeout(t);
    if (res.ok) return;
    if (res.status === 400) { const body = await res.json().catch(() => null); throw new Error((body && body.error) || 'Please check your entry'); }
    throw new Error('local endpoint unavailable');
  } catch (e) {
    if (e.message && (e.message.includes('phone') || e.message.includes('name') || e.message.includes('address'))) throw e;
    await supabaseInsertCheckin(Object.assign({}, record, { source: 'public_web' }));
  }
}

function setMemberMode(mode) {
  document.getElementById('memberIndividualBtn').classList.toggle('active', mode === 'individual');
  document.getElementById('memberFamilyBtn').classList.toggle('active', mode === 'family');
  document.getElementById('wardIndividualSection').style.display = mode === 'individual' ? '' : 'none';
  document.getElementById('wardFamilySection').style.display = mode === 'family' ? '' : 'none';
  document.getElementById('familyDetailsSection').style.display = 'none';
}
document.getElementById('memberIndividualBtn').addEventListener('click', () => setMemberMode('individual'));
document.getElementById('memberFamilyBtn').addEventListener('click', () => setMemberMode('family'));

async function submitMemberIndividual(ward) {
  try {
    await submitCheckin({ entry_type: 'individual', ward });
    showMemberDone();
  } catch (e) { showError(e.message); }
}

function showMemberDone() {
  document.getElementById('wardIndividualSection').style.display = 'none';
  document.getElementById('wardFamilySection').style.display = 'none';
  document.getElementById('familyDetailsSection').style.display = 'none';
  document.querySelector('#memberCard .toggle-group').style.display = 'none';
  document.getElementById('memberDoneMsg').style.display = '';
}

document.getElementById('notMemberBtn').addEventListener('click', () => {
  document.getElementById('notMemberBtn').style.display = 'none';
  document.querySelector('.or-divider').style.display = 'none';
  document.getElementById('memberCard').style.display = 'none';
  document.getElementById('guestCard').style.display = '';
});
document.getElementById('backToWelcome').addEventListener('click', () => {
  document.getElementById('notMemberBtn').style.display = '';
  document.querySelector('.or-divider').style.display = '';
  document.getElementById('memberCard').style.display = '';
  document.getElementById('guestCard').style.display = 'none';
});

document.getElementById('partyMinus').addEventListener('click', () => {
  const input = document.getElementById('partySize');
  input.value = Math.max(1, parseInt(input.value || '1', 10) - 1);
});
document.getElementById('partyPlus').addEventListener('click', () => {
  const input = document.getElementById('partySize');
  input.value = Math.max(1, parseInt(input.value || '1', 10) + 1);
});

document.getElementById('familySubmitBtn').addEventListener('click', async () => {
  const adult_name = document.getElementById('famName').value.trim();
  const phone = document.getElementById('famPhone').value.trim();
  const address = document.getElementById('famAddress').value.trim();
  if (!adult_name) return showError('Please enter your name');
  if (!phone && !address) return showError('Please enter a phone number or address');
  try {
    await submitCheckin({
      entry_type: 'family', adult_name, phone, address, ward: selectedFamilyWard,
      party_size: document.getElementById('partySize').value
    });
    showMemberDone();
  } catch (e) { showError(e.message); }
});

document.getElementById('guestSubmitBtn').addEventListener('click', async () => {
  const adult_name = document.getElementById('guestName').value.trim();
  const phone = document.getElementById('guestPhone').value.trim();
  const address = document.getElementById('guestAddress').value.trim();
  const invited_by = document.getElementById('guestInvitedBy').value.trim();
  if (!adult_name) return showError('Please enter your name');
  if (!phone && !address) return showError('Please enter a phone number or address');
  try {
    await submitCheckin({ entry_type: 'guest', adult_name, phone, address, invited_by });
    document.getElementById('guestCard').style.display = 'none';
    document.getElementById('doneCard').style.display = '';
  } catch (e) { showError(e.message); }
});

function showError(msg) {
  let el = document.getElementById('errMsg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'errMsg';
    el.style.cssText = 'color:#c0392b;font-weight:600;margin-top:10px;text-align:center';
    document.querySelector('.wrap').appendChild(el);
  }
  el.textContent = msg || 'Something went wrong, please try again';
}
</script>
</body>
</html>
