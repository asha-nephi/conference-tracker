<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-In Station</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/station">Station</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/display-qr">Show QR</a>
    <a href="/export?format=csv">Export CSV</a>
  </div>
  <h1>Usher Check-In</h1>
  <p class="subtitle">Zone <span id="zoneLabel" class="badge">…</span></p>

  <button class="btn-primary big-cta" id="notMemberBtn">Not a member</button>

  <div class="or-divider">or, member</div>

  <div class="card member-card" id="memberCard">
    <div id="wardPickSection">
      <p class="subtitle" style="margin:0 0 8px">Which ward?</p>
      <div class="ward-grid-compact" id="wardGrid"></div>
    </div>

    <div id="memberTypeSection" style="display:none">
      <p class="subtitle" style="margin:0 0 10px" id="selectedWardLabel"></p>
      <div class="toggle-group">
        <button class="toggle-btn" id="memberIndividualBtn" type="button">Individual</button>
        <button class="toggle-btn" id="memberFamilyBtn" type="button">Family / with kids</button>
      </div>

      <div id="familyDetailsSection" style="display:none">
        <label for="famName">Name (one household member is fine)</label>
        <input type="text" id="famName" placeholder="e.g. Sister Adeyemi">

        <label>How many are in this group? (including the adult)</label>
        <div class="counter-row">
          <button class="counter-btn" id="partyMinus" type="button">-</button>
          <input type="number" id="partySize" value="1" min="1">
          <button class="counter-btn" id="partyPlus" type="button">+</button>
        </div>

        <button class="btn-primary" id="familySubmitBtn">Check In</button>
      </div>

      <button class="btn-secondary" id="changeWardBtn">Change ward</button>
    </div>
  </div>

  <div class="card" id="guestCard" style="display:none">
    <p class="subtitle" style="margin:0 0 8px">First-time guest or investigator. It's fine if they came on their own.</p>
    <label for="guestName">Guest's name</label>
    <input type="text" id="guestName" placeholder="e.g. John Smith">

    <label for="guestPhone">Phone</label>
    <input type="text" id="guestPhone" placeholder="Optional if address given">
    <label for="guestAddress">Address</label>
    <input type="text" id="guestAddress" placeholder="Optional if phone given">

    <label for="guestInvitedBy">Invited by (optional)</label>
    <input type="text" id="guestInvitedBy" placeholder="Leave blank if they came on their own">

    <button class="btn-primary" id="guestSubmitBtn">Check In</button>
    <button class="btn-secondary" id="backToWelcome">Back</button>
  </div>

  <div class="card">
    <div class="total-big" id="totalPeople">0</div>
    <div class="total-label">people checked in so far (this gate, incl. QR self check-in) <span id="syncStatus"></span></div>
    <div class="stat-grid">
      <div class="stat"><div class="n" id="statIndividuals">0</div><div class="l">Individuals</div></div>
      <div class="stat"><div class="n" id="statFamilies">0</div><div class="l">Families</div></div>
      <div class="stat"><div class="n" id="statGuests">0</div><div class="l">Guests/Investigators</div></div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
let selectedWard = null;
let WARDS = [];

function renderWardGrid(el, onPick) {
  el.innerHTML = '';
  WARDS.forEach((w) => {
    const btn = document.createElement('button');
    btn.className = 'ward-btn-compact';
    btn.type = 'button';
    btn.textContent = w;
    btn.addEventListener('click', () => onPick(w));
    el.appendChild(btn);
  });
}

function setMemberMode(mode) {
  document.getElementById('memberIndividualBtn').classList.toggle('active', mode === 'individual');
  document.getElementById('memberFamilyBtn').classList.toggle('active', mode === 'family');
  document.getElementById('familyDetailsSection').style.display = mode === 'family' ? '' : 'none';
}

function resetToWelcome() {
  document.getElementById('notMemberBtn').style.display = '';
  document.querySelector('.or-divider').style.display = '';
  document.getElementById('memberCard').style.display = '';
  document.getElementById('guestCard').style.display = 'none';
  document.getElementById('wardPickSection').style.display = '';
  document.getElementById('memberTypeSection').style.display = 'none';
  setMemberMode(null);
}

document.getElementById('notMemberBtn').addEventListener('click', () => {
  document.getElementById('notMemberBtn').style.display = 'none';
  document.querySelector('.or-divider').style.display = 'none';
  document.getElementById('memberCard').style.display = 'none';
  document.getElementById('guestCard').style.display = '';
});
document.getElementById('backToWelcome').addEventListener('click', resetToWelcome);
document.getElementById('changeWardBtn').addEventListener('click', () => {
  document.getElementById('wardPickSection').style.display = '';
  document.getElementById('memberTypeSection').style.display = 'none';
});

document.getElementById('memberIndividualBtn').addEventListener('click', () => {
  setMemberMode('individual');
  submitMemberIndividual();
});
document.getElementById('memberFamilyBtn').addEventListener('click', () => setMemberMode('family'));

async function submitMemberIndividual() {
  try {
    await submitCheckin({ entry_type: 'individual', ward: selectedWard }, 'form');
    showToast('Checked in');
    resetToWelcome();
    refreshTotals();
  } catch (e) { showToast(e.message || 'Error - try again'); }
}

document.getElementById('partyMinus').addEventListener('click', () => {
  const input = document.getElementById('partySize');
  input.value = Math.max(1, parseInt(input.value || '1', 10) - 1);
});
document.getElementById('partyPlus').addEventListener('click', () => {
  const input = document.getElementById('partySize');
  input.value = Math.max(1, parseInt(input.value || '1', 10) + 1);
});

function resetFamilyForm() {
  document.getElementById('famName').value = '';
  document.getElementById('partySize').value = 1;
}
function resetGuestForm() {
  document.getElementById('guestName').value = '';
  document.getElementById('guestPhone').value = '';
  document.getElementById('guestAddress').value = '';
  document.getElementById('guestInvitedBy').value = '';
}

document.getElementById('familySubmitBtn').addEventListener('click', async () => {
  const adult_name = document.getElementById('famName').value.trim();
  if (!adult_name) return showToast('Enter a name');
  try {
    await submitCheckin({
      entry_type: 'family', adult_name, ward: selectedWard,
      party_size: document.getElementById('partySize').value
    }, 'form');
    showToast('Family checked in');
    resetFamilyForm();
    resetToWelcome();
    refreshTotals();
  } catch (e) { showToast(e.message || 'Error - try again'); }
});

document.getElementById('guestSubmitBtn').addEventListener('click', async () => {
  const adult_name = document.getElementById('guestName').value.trim();
  const phone = document.getElementById('guestPhone').value.trim();
  const address = document.getElementById('guestAddress').value.trim();
  const invited_by = document.getElementById('guestInvitedBy').value.trim();
  if (!adult_name) return showToast("Enter the guest's name");
  if (!phone && !address) return showToast('Enter a phone number or address');
  try {
    await submitCheckin({ entry_type: 'guest', adult_name, phone, address, invited_by }, 'form');
    showToast('Guest checked in');
    resetGuestForm();
    resetToWelcome();
    refreshTotals();
  } catch (e) { showToast(e.message || 'Error - try again'); }
});

async function refreshTotals() {
  try {
    const t = await fetchTotals();
    document.getElementById('totalPeople').textContent = t.total_people;
    document.getElementById('statIndividuals').textContent = t.individuals;
    document.getElementById('statFamilies').textContent = t.families;
    document.getElementById('statGuests').textContent = t.guests;
    document.getElementById('syncStatus').textContent = t.cloud_merged ? '' : '(offline — QR self check-ins not yet included)';
  } catch (e) { /* ignore */ }
}

fetchMeta().then((m) => {
  document.getElementById('zoneLabel').textContent = m.zone;
  WARDS = m.wards || [];
  renderWardGrid(document.getElementById('wardGrid'), (ward) => {
    selectedWard = ward;
    document.getElementById('selectedWardLabel').textContent = ward;
    document.getElementById('wardPickSection').style.display = 'none';
    document.getElementById('memberTypeSection').style.display = '';
    setMemberMode(null);
  });
});
refreshTotals();
setInterval(refreshTotals, 4000);
</script>
</body>
</html>
